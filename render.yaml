services:
  - type: web
    name: hobal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/model/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VIDEO_IMGSZ
        value: "640"
      - key: VIDEO_SAMPLE_FPS
        value: "2"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
